<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <title>Video Editor</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.9/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        // لاحظ هنا: المسميات تطابق ما أرسلناه من الفلاتر
        async function processVideo(description, textOverlay, audioBytes) {
            if (!ffmpeg.loaded) {
                await ffmpeg.load({ coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js' });
            }

            // 1. جلب الفيديو من Pexels باستخدام الوصف
            const apiKey = "ضع_مفتاحك_هنا"; // ضع مفتاحك هنا
            const response = await fetch(`https://api.pexels.com/videos/search?query=${encodeURIComponent(description)}&per_page=1`, {
                headers: { 'Authorization': apiKey }
            });
            const data = await response.json();
            const videoUrl = data.videos[0].video_files[0].link;
            
            // 2. تحميل الفيديو كـ ArrayBuffer
            const videoResponse = await fetch(videoUrl);
            const videoBlob = await videoResponse.blob();
            const videoArrayBuffer = await videoBlob.arrayBuffer();

            // 3. كتابة الملفات في FFmpeg
            await ffmpeg.writeFile('input.mp4', new Uint8Array(videoArrayBuffer));
            await ffmpeg.writeFile('audio.mp3', audioBytes);

            // 4. تنفيذ المعالجة
            await ffmpeg.exec([
                '-i', 'input.mp4',
                '-i', 'audio.mp3',
                '-filter_complex', `[0:v]drawtext=text='${textOverlay}':x=(w-text_w)/2:y=h-50:fontsize=30:fontcolor=white[v];[0:a]volume=0.3[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first`,
                '-map', '[v]',
                '-map', '[a]',
                '-c:v', 'libx264',
                '-c:a', 'aac',
                'output.mp4'
            ]);

            // 5. تحميل النتيجة
            const result = await ffmpeg.readFile('output.mp4');
            const blob = new Blob([result], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = 'my_video.mp4';
            anchor.click();
            return true;
        }
    </script>
</body>
</html>
