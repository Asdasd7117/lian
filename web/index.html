<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <title>Video Editor</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.9/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        // دالة المونتاج: تستقبل البايتات الخاصة بالفيديو والصوت والنص
        async function processVideo(videoBytes, audioBytes, text) {
            if (!ffmpeg.loaded) {
                await ffmpeg.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
                });
            }

            // كتابة الملفات في ذاكرة المتصفح
            await ffmpeg.writeFile('input.mp4', videoBytes);
            await ffmpeg.writeFile('audio.mp3', audioBytes);

            // أمر المونتاج: دمج الصوت مع الفيديو + كتابة النص
            await ffmpeg.exec([
                '-i', 'input.mp4',
                '-i', 'audio.mp3',
                '-filter_complex', `[0:v]drawtext=text='${text}':x=(w-text_w)/2:y=h-50:fontsize=30:fontcolor=white[v];[0:a]volume=0.3[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first`,
                '-map', '[v]',
                '-map', '[a]',
                '-c:v', 'libx264',
                '-c:a', 'aac',
                'output.mp4'
            ]);

            // قراءة النتيجة وتحميلها
            const data = await ffmpeg.readFile('output.mp4');
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'edited_video.mp4';
            link.click();
            return "تم الإنتاج بنجاح";
        }
    </script>
</body>
</html>
